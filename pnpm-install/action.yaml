name: Install dependencies
description: Install node, pnpm, and dependencies

inputs:
  node-version:
    description: "Node.js version. Ignored when node-version-file is set"
    default: "24"
  node-version-file:
    description: "File containing the Node.js version (e.g. .nvmrc, .node-version), relative to the repository root. Takes precedence over node-version"
    required: false
    default: ""
  pnpm-version:
    description: "pnpm version (optional, defaults to the packageManager field in package.json)"
    required: false
  cwd:
    description: "Working directory for pnpm commands"
    default: "."
  cache:
    description: "Cache the pnpm store with actions/cache. Set to \"false\" in release/publish workflows to prevent cache poisoning"
    required: false
    default: "true"
  registry-url:
    description: "Registry URL passed to actions/setup-node (e.g. https://registry.npmjs.org). Writes an .npmrc that authenticates with NODE_AUTH_TOKEN"
    required: false
    default: ""
  frozen-lockfile:
    description: "\"true\" runs pnpm install --frozen-lockfile, \"false\" runs pnpm install --no-frozen-lockfile. Empty (default) uses pnpm's default, which is frozen on CI"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
        node-version-file: ${{ inputs.node-version-file }}
        registry-url: ${{ inputs.registry-url }}

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      name: Install pnpm
      id: pnpm-install
      with:
        version: ${{ inputs.pnpm-version }}
        package_json_file: ${{ inputs.cwd }}/package.json
        run_install: false

    - name: Get pnpm store directory
      id: pnpm-cache
      if: inputs.cache == 'true'
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      name: Setup pnpm cache
      if: inputs.cache == 'true'
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Audit dependencies for critical vulnerabilities
      shell: bash
      working-directory: ${{ inputs.cwd }}
      run: pnpm audit --audit-level=critical --ignore-registry-errors

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.cwd }}
      env:
        FROZEN_LOCKFILE: ${{ inputs.frozen-lockfile }}
      run: |
        case "$FROZEN_LOCKFILE" in
          true) pnpm install --frozen-lockfile ;;
          false) pnpm install --no-frozen-lockfile ;;
          *) pnpm install ;;
        esac
